openapi: 3.1.0
info:
  title: SIGA-TI API
  version: 0.1.0
  description: "Sistema de Gestión de Solicitudes TI (prototipo, datos ficticios). Documento generado desde los esquemas Zod de `packages/shared`: no editar a mano (`pnpm openapi:generate`)."
servers:
  - url: /api/v1
    description: API
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthSession:
      type: object
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          exclusiveMinimum: 0
        user:
          $ref: "#/components/schemas/User"
      required:
        - accessToken
        - expiresIn
        - user
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - fullName
        - role
        - isActive
        - createdAt
    Role:
      type: string
      enum:
        - SOLICITANTE
        - TECNICO
        - SUPERVISOR
        - ADMIN
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                  message:
                    type: string
                required:
                  - path
                  - message
            requestId:
              type: string
              format: uuid
          required:
            - code
            - message
            - details
            - requestId
      required:
        - error
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - INVALID_CREDENTIALS
        - FORBIDDEN
        - NOT_FOUND
        - INVALID_TRANSITION
        - INVALID_ASSIGNEE
        - CONCURRENT_MODIFICATION
        - TICKET_CLOSED
        - RATE_LIMITED
        - INTERNAL_ERROR
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 128
      required:
        - email
        - password
      additionalProperties: false
    Ticket:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          pattern: ^SIGA-\d{6,}$
        title:
          type: string
        description:
          type: string
        category:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
          required:
            - id
            - name
        priority:
          $ref: "#/components/schemas/Priority"
        status:
          $ref: "#/components/schemas/TicketStatus"
        requester:
          $ref: "#/components/schemas/UserSummary"
        assignee:
          allOf:
            - $ref: "#/components/schemas/UserSummary"
            - type:
                - object
                - "null"
        dueAt:
          type: string
          format: date-time
        isOverdue:
          type: boolean
        resolvedAt:
          type:
            - string
            - "null"
          format: date-time
        closedAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - code
        - title
        - description
        - category
        - priority
        - status
        - requester
        - assignee
        - dueAt
        - isOverdue
        - resolvedAt
        - closedAt
        - createdAt
        - updatedAt
    Priority:
      type: string
      enum:
        - CRITICA
        - ALTA
        - MEDIA
        - BAJA
    TicketStatus:
      type: string
      enum:
        - ABIERTA
        - ASIGNADA
        - EN_PROGRESO
        - EN_ESPERA
        - RESUELTA
        - CERRADA
    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
      required:
        - id
        - fullName
    CreateTicketRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 120
        description:
          type: string
          minLength: 10
          maxLength: 5000
        categoryId:
          type: string
          format: uuid
        priority:
          $ref: "#/components/schemas/Priority"
        requesterId:
          type: string
          format: uuid
      required:
        - title
        - description
        - categoryId
        - priority
      additionalProperties: false
    AssignTicketRequest:
      type: object
      properties:
        assigneeId:
          type: string
          format: uuid
      required:
        - assigneeId
      additionalProperties: false
    TransitionTicketRequest:
      type: object
      properties:
        to:
          type: string
          enum:
            - EN_PROGRESO
            - EN_ESPERA
            - RESUELTA
            - CERRADA
        note:
          type: string
          minLength: 3
          maxLength: 1000
      required:
        - to
      additionalProperties: false
    TicketEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/TicketEventType"
        actor:
          $ref: "#/components/schemas/UserSummary"
        fromStatus:
          allOf:
            - $ref: "#/components/schemas/TicketStatus"
            - type:
                - string
                - "null"
        toStatus:
          allOf:
            - $ref: "#/components/schemas/TicketStatus"
            - type:
                - string
                - "null"
        fromAssignee:
          allOf:
            - $ref: "#/components/schemas/UserSummary"
            - type:
                - object
                - "null"
        toAssignee:
          allOf:
            - $ref: "#/components/schemas/UserSummary"
            - type:
                - object
                - "null"
        note:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - type
        - actor
        - fromStatus
        - toStatus
        - fromAssignee
        - toAssignee
        - note
        - createdAt
    TicketEventType:
      type: string
      enum:
        - CREATED
        - ASSIGNED
        - REASSIGNED
        - STATUS_CHANGED
    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        author:
          $ref: "#/components/schemas/UserSummary"
        body:
          type: string
        visibility:
          $ref: "#/components/schemas/CommentVisibility"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - author
        - body
        - visibility
        - createdAt
    CommentVisibility:
      type: string
      enum:
        - PUBLICO
        - INTERNO
    CreateCommentRequest:
      type: object
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
        visibility:
          $ref: "#/components/schemas/CommentVisibility"
      required:
        - body
      additionalProperties: false
    DashboardSummary:
      type: object
      properties:
        total:
          type: integer
          minimum: 0
        byStatus:
          type: array
          items:
            type: object
            properties:
              status:
                $ref: "#/components/schemas/TicketStatus"
              count:
                type: integer
                minimum: 0
            required:
              - status
              - count
        backlog:
          type: integer
          minimum: 0
        unassigned:
          type: integer
          minimum: 0
        overdue:
          type: integer
          minimum: 0
      required:
        - total
        - byStatus
        - backlog
        - unassigned
        - overdue
    ResolutionMetrics:
      type: object
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        resolvedCount:
          type: integer
          minimum: 0
        averageResolutionHours:
          type:
            - number
            - "null"
          minimum: 0
        slaCompliancePercent:
          type:
            - number
            - "null"
          minimum: 0
          maximum: 100
        withinSlaCount:
          type: integer
          minimum: 0
        breachedCount:
          type: integer
          minimum: 0
      required:
        - from
        - to
        - resolvedCount
        - averageResolutionHours
        - slaCompliancePercent
        - withinSlaCount
        - breachedCount
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type:
            - string
            - "null"
        isActive:
          type: boolean
      required:
        - id
        - name
        - description
        - isActive
  parameters: {}
paths:
  /auth/login:
    post:
      operationId: login
      tags:
        - auth
      summary: Ingreso con identidad simulada (RF-01)
      description: Limitado por IP (429). Responde igual ante usuario inexistente o clave errónea. Establece la cookie httpOnly `siga_rt` (refresh token).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Entrada inválida (VALIDATION_ERROR). `details` lista campo y mensaje.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado (UNAUTHENTICATED, INVALID_CREDENTIALS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Demasiadas peticiones (RATE_LIMITED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno (INTERNAL_ERROR); el detalle solo queda en logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/refresh:
    post:
      operationId: refreshSession
      tags:
        - auth
      summary: Renueva la sesión rotando el refresh token (RF-03)
      description: Lee la cookie `siga_rt` y la rota. Reutilizar un token ya rotado revoca todas las sesiones del usuario.
      responses:
        "200":
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: No autenticado (UNAUTHENTICATED, INVALID_CREDENTIALS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno (INTERNAL_ERROR); el detalle solo queda en logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logout
      tags:
        - auth
      summary: Cierra la sesión y revoca el refresh token (RF-03)
      description: Idempotente; limpia la cookie aunque el token sea inválido.
      responses:
        "204":
          description: Respuesta exitosa
        "500":
          description: Error interno (INTERNAL_ERROR); el detalle solo queda en logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags:
        - auth
      summary: Usuario autenticado
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: No autenticado (UNAUTHENTICATED, INVALID_CREDENTIALS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno (INTERNAL_ERROR); el detalle solo queda en logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tickets:
    post:
      operationId: createTicket
      tags:
        - tickets
      summary: Registrar solicitud (RF-04)
      description: "Roles: SOLICITANTE, TECNICO, SUPERVISOR. `requesterId` (registro a nombre de otro) solo lo acepta el SUPERVISOR. Calcula `dueAt` con la política SLA de la prioridad y crea el evento CREATED."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTicketRequest"
      responses:
        "201":
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          description: Entrada inválida (VALIDATION_ERROR). `details` lista campo y mensaje.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado (UNAUTHENTICATED, INVALID_CREDENTIALS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: El rol o el actor no tiene permiso (FORBIDDEN).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No existe o no es visible para el usuario (NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno (INTERNAL_ERROR); el detalle solo queda en logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listTickets
      tags:
        - tickets
      summary: Listar con filtros y paginación (RF-05)
      description: "Solo devuelve las solicitudes visibles: solicitante y técnico, las propias o asignadas a ellos; supervisor y admin, todas. Orden: más recientes primero."
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: integer
            minimum: 1
            default: 1
          required: false
          name: page
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          required: false
          name: pageSize
          in: query
        - schema:
            $ref: "#/components/schemas/TicketStatus"
          required: false
          name: status
          in: query
        - schema:
            $ref: "#/components/schemas/Priority"
          required: false
          name: priority
          in: query
        - schema:
            type: string
            format: uuid
          required: false
          name: categoryId
          in: query
        - schema:
            type: string
            format: uuid
          required: false
          name: assigneeId
          in: query
      responses:
        "200":
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  page:
                    type: integer
                    minimum: 1
                  pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                  totalItems:
                    type: integer
                    minimum: 0
                  totalPages:
                    type: integer
                    minimum: 0
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Ticket"
                required:
                  - page
                  - pageSize
                  - totalItems
                  - totalPages
                  - items
        "400":
          description: Entrada inválida (VALIDATION_ERROR). `details` lista campo y mensaje.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado (UNAUTHENTICATED, INVALID_CREDENTIALS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno (INTERNAL_ERROR); el detalle solo queda en logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tickets/{ticketId}:
    get:
      operationId: getTicket
      tags:
        - tickets
      summary: Detalle de solicitud
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: ticketId
          in: path
      responses:
        "200":
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          description: Entrada inválida (VALIDATION_ERROR). `details` lista campo y mensaje.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado (UNAUTHENTICATED, INVALID_CREDENTIALS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No existe o no es visible para el usuario (NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno (INTERNAL_ERROR); el detalle solo queda en logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tickets/{ticketId}/assignment:
    put:
      operationId: assignTicket
      tags:
        - tickets
      summary: Asignar o reasignar a un técnico (RF-06)
      description: Solo SUPERVISOR. El destino debe ser un TECNICO activo (409 INVALID_ASSIGNEE). En ABIERTA pasa a ASIGNADA (evento ASSIGNED). En ASIGNADA, EN_PROGRESO o EN_ESPERA solo cambia el técnico (evento REASSIGNED). En RESUELTA o CERRADA responde 409 INVALID_TRANSITION.
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: ticketId
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignTicketRequest"
      responses:
        "200":
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          description: Entrada inválida (VALIDATION_ERROR). `details` lista campo y mensaje.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado (UNAUTHENTICATED, INVALID_CREDENTIALS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: El rol o el actor no tiene permiso (FORBIDDEN).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No existe o no es visible para el usuario (NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Regla de negocio (INVALID_TRANSITION, INVALID_ASSIGNEE, CONCURRENT_MODIFICATION, TICKET_CLOSED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno (INTERNAL_ERROR); el detalle solo queda en logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tickets/{ticketId}/transitions:
    post:
      operationId: transitionTicket
      tags:
        - tickets
      summary: Cambiar estado (RF-07, RF-13)
      description: Transiciones y actores permitidos en docs/data-model.md §3. `ASIGNADA` solo se alcanza al asignar. `note` es obligatoria para EN_ESPERA, RESUELTA y reabrir. Si dos usuarios compiten, el perdedor recibe 409 CONCURRENT_MODIFICATION.
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: ticketId
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionTicketRequest"
      responses:
        "200":
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          description: Entrada inválida (VALIDATION_ERROR). `details` lista campo y mensaje.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado (UNAUTHENTICATED, INVALID_CREDENTIALS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: El rol o el actor no tiene permiso (FORBIDDEN).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No existe o no es visible para el usuario (NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Regla de negocio (INVALID_TRANSITION, INVALID_ASSIGNEE, CONCURRENT_MODIFICATION, TICKET_CLOSED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno (INTERNAL_ERROR); el detalle solo queda en logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tickets/{ticketId}/events:
    get:
      operationId: listTicketEvents
      tags:
        - tickets
      summary: Historial inmutable (RF-08)
      description: Orden cronológico ascendente.
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: ticketId
          in: path
      responses:
        "200":
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TicketEvent"
                required:
                  - items
        "400":
          description: Entrada inválida (VALIDATION_ERROR). `details` lista campo y mensaje.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado (UNAUTHENTICATED, INVALID_CREDENTIALS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No existe o no es visible para el usuario (NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno (INTERNAL_ERROR); el detalle solo queda en logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tickets/{ticketId}/comments:
    get:
      operationId: listTicketComments
      tags:
        - tickets
      summary: Comentarios (RF-09)
      description: Los INTERNO solo se devuelven a técnico asignado, supervisor y admin.
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: ticketId
          in: path
      responses:
        "200":
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Comment"
                required:
                  - items
        "400":
          description: Entrada inválida (VALIDATION_ERROR). `details` lista campo y mensaje.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado (UNAUTHENTICATED, INVALID_CREDENTIALS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No existe o no es visible para el usuario (NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno (INTERNAL_ERROR); el detalle solo queda en logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: addTicketComment
      tags:
        - tickets
      summary: Agregar comentario (RF-09)
      description: El solicitante solo puede publicar PUBLICO. No se comenta una solicitud CERRADA (409 TICKET_CLOSED).
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: ticketId
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
      responses:
        "201":
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          description: Entrada inválida (VALIDATION_ERROR). `details` lista campo y mensaje.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado (UNAUTHENTICATED, INVALID_CREDENTIALS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: El rol o el actor no tiene permiso (FORBIDDEN).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No existe o no es visible para el usuario (NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Regla de negocio (INVALID_TRANSITION, INVALID_ASSIGNEE, CONCURRENT_MODIFICATION, TICKET_CLOSED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno (INTERNAL_ERROR); el detalle solo queda en logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
